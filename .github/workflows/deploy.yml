name: Deploy nopCommerce to EC2

on:
  push:
    branches: [ develop ]

env:
  DOTNET_VERSION: '9.0.x'  # Updated to .NET 9
  DEPLOY_DIR: '/var/www/nopcommerce'
  SERVICE_NAME: 'nopcommerce'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4  # Updated to v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Build with dotnet
      run: |
        dotnet clean src/NopCommerce.sln
        dotnet restore src/NopCommerce.sln
        dotnet publish src/NopCommerce.sln -c Release -o ./publish \
          /p:ErrorOnDuplicatePublishOutputFiles=false
          
    - name: Copy Installation Files
      run: |
       mkdir -p publish/App_Data/Installation
       cp src/Presentation/Nop.Web/App_Data/Installation/* publish/App_Data/Installation/
 
    - name: Copy Plugins to Publish Directory
      run: |
        # Create plugins directory
        mkdir -p publish/Plugins
        
        # Define plugin mappings (source → destination)
        declare -A plugins=(
          ["src/Plugins/95942_1030_Omnisend.zip"]="Plugins/95942_1030_Omnisend.zip"
          # Add more plugins here as needed:
          # ["src/Plugins/another_plugin.zip"]="Plugins/another_plugin.zip"
        )
        
        # Copy each plugin
        for src in "${!plugins[@]}"; do
          dest="${plugins[$src]}"
          if [ -f "$src" ]; then
            echo "Copying plugin: $src → publish/$dest"
            cp "$src" "publish/$dest"
          else
            echo "Warning: Plugin file not found: $src"
          fi
        done
       
    - name: Zip artifacts
      uses: montudor/action-zip@v1
      with:
        args: zip -qq -r nopcommerce.zip ./publish
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4  # Updated to v4
      with:
        name: nopcommerce-app
        path: ./nopcommerce.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4  # Updated to v4
      with:
        name: nopcommerce-app
        
    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.EC2_SSH_KEY }}
        known_hosts: 'just-a-placeholder-so-we-dont-get-errors'
        config: |
          Host ${{ secrets.EC2_HOST }}
          HostName ${{ secrets.EC2_HOST }}
          User ${{ secrets.EC2_USERNAME }}
          IdentityFile ~/.ssh/id_rsa
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
    
    - name: Test SSH connection
      run: ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "echo 'SSH successful!'"
       
    - name: Deploy to EC2
      run: |
       # Install unzip if not present
       ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
        "sudo yum install -y unzip || sudo apt-get install -y unzip"
        
       # Create secure remote directory
       ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
          "mkdir -p ~/deployments && \
          chmod 700 ~/deployments && \
          { [ -d ~/deployments ] && rm -rf ~/deployments/* || true; }"
         
        # Secure copy with checksum verification
        scp nopcommerce.zip \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/deployments/nopcommerce.zip
         
        # Deploy with proper permissions and config preservation
        ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
          "unzip -q ~/deployments/nopcommerce.zip -d ~/deployments/unzipped && \
          sudo mkdir -p ${{ env.DEPLOY_DIR }} && \
          
          # Preserve existing production config if exists in App_Data
          if [ -f ${{ env.DEPLOY_DIR }}/App_Data/appsettings.Production.json ]; then
            sudo cp ${{ env.DEPLOY_DIR }}/App_Data/appsettings.Production.json ~/deployments/
          fi
          
          sudo rm -rf ${{ env.DEPLOY_DIR }}/* && \
          sudo cp -r ~/deployments/unzipped/publish/* ${{ env.DEPLOY_DIR }}/ && \
          
          # Restore production config if it existed
          if [ -f ~/deployments/appsettings.Production.json ]; then
            sudo mkdir -p ${{ env.DEPLOY_DIR }}/App_Data
            sudo mv ~/deployments/appsettings.Production.json ${{ env.DEPLOY_DIR }}/App_Data/
            sudo chmod 600 ${{ env.DEPLOY_DIR }}/App_Data/appsettings.Production.json
          fi
          
          # Deploy all plugins
          sudo mkdir -p ${{ env.DEPLOY_DIR }}/Plugins && \
          for plugin in ~/deployments/unzipped/publish/Plugins/*.zip; do
            if [ -f \"\$plugin\" ]; then
              sudo cp \"\$plugin\" ${{ env.DEPLOY_DIR }}/Plugins/
            fi
          done
          
          # Set secure permissions
          sudo find ${{ env.DEPLOY_DIR }} -type d -exec chmod 755 {} \; && \
          sudo find ${{ env.DEPLOY_DIR }} -type f -exec chmod 644 {} \; && \
          sudo chown -R www-data:www-data ${{ env.DEPLOY_DIR }} && \
          
          # Restart service
          sudo systemctl restart ${{ env.SERVICE_NAME }}.service"
